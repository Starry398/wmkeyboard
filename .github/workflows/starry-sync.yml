name: Sync fork

# The MCP GitHub server has no merge-upstream call, so the merge happens here.
# Manual only. A merge commit pushed by GITHUB_TOKEN does not start other
# workflows, which is what we want: no rebuild from a sync.
#
# The workflows folder is restored from this fork's own commit after the merge:
# GitHub refuses any push that touches .github/workflows without the `workflows`
# permission, and GITHUB_TOKEN never has it. Upstream's CI is not needed here
# anyway; only the starry-* workflows are.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Merge upstream main
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Merge and push
        run: |
          set -euo pipefail
          git config user.name "Starry398"
          git config user.email "149395382+Starry398@users.noreply.github.com"
          git remote add upstream https://github.com/wasi-master/wmkeyboard.git
          git fetch upstream main --no-tags
          echo "fork before: $(git rev-parse --short HEAD)"
          echo "upstream:    $(git rev-parse --short upstream/main)"
          git merge --no-edit upstream/main
          echo "merged:      $(git rev-parse --short HEAD)"

          rm -rf .github/workflows
          git checkout HEAD^1 -- .github/workflows
          git add -A .github/workflows
          git commit --amend --no-edit --allow-empty

          echo "pushing:     $(git rev-parse --short HEAD)"
          git push origin HEAD:main
