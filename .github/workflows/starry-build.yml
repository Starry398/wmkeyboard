name: Starry build (arm64)

# Manual only. base_sha checks out an older commit before the patch is applied.
# The patch in starry/patch/ is a real git diff whose blobs match d30445fe
# (2026-11-10), so that is the default; leave the input empty to build main's
# tip, where apply.py will say whether the patch still lands.
on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: 'Commit to build (empty = main tip)'
        required: false
        default: 'd30445fe3974c0fc286aa8a77014264a1f48f123'

concurrency:
  group: starry-build
  cancel-in-progress: true

env:
  WMKB_ENABLE_PLAY_STORE: "false"
  WMKB_ENABLE_GMS: "false"
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g -Dorg.gradle.daemon=false

jobs:
  apk:
    name: Assemble arm64-v8a debug
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # starry/ is tracked on main but absent from the older commit, so a plain
      # checkout would delete the very script that runs next. Keep a copy.
      - name: Check out the requested base commit
        if: inputs.base_sha != ''
        run: |
          cp -r starry /tmp/starry-backup
          git checkout "${{ inputs.base_sha }}"
          rm -rf starry
          cp -r /tmp/starry-backup starry
          git log -1 --format='building %h %s'

      - name: Apply the patch
        run: python3 starry/patch/apply.py

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # debug builds arm64 alone already (app/build.gradle.kts), and carries the
      # debug signature, so it installs over a previous sideload without a
      # keystore. The injected ABI is belt and braces.
      - name: Assemble
        run: ./gradlew assembleEnDebug -Pandroid.injected.build.abi=arm64-v8a --stacktrace

      # AGP 9 does not put packageEnDebug's output under build/outputs, so search
      # the whole module. On a miss, print the tree: guessing the path again
      # costs a full round trip.
      - name: Find the apk
        run: |
          find app/build -name '*.apk' -printf '%p %s bytes\n' | tee /tmp/apks.txt
          if [ ! -s /tmp/apks.txt ]; then
            echo '--- no apk found; app/build layout ---'
            find app/build -maxdepth 5 -type d | head -60
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: wmkb-arm64-debug
          path: app/build/**/*.apk
          if-no-files-found: error
          retention-days: 14
