name: Starry build (arm64)

on:
  push:
    paths:
      - 'starry/patch/**'
      - '.github/workflows/starry-build.yml'
  workflow_dispatch:

concurrency:
  group: starry-${{ github.ref }}
  cancel-in-progress: true

env:
  WMKB_ENABLE_PLAY_STORE: "false"
  WMKB_ENABLE_GMS: "false"
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g -Dorg.gradle.daemon=false

jobs:
  apk:
    name: Assemble arm64-v8a debug
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Apply the patches
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(starry/patch/*.patch)
          for p in "${files[@]}"; do
            echo "::group::$p"
            git apply -v "$p" || patch -p1 --fuzz=3 < "$p"
            echo "::endgroup::"
          done
          git status --short

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Assemble
        run: ./gradlew assembleEnDebug -Pandroid.injected.build.abi=arm64-v8a --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: wmkb-arm64-debug
          path: |
            app/build/outputs/apk/en/debug/*.apk
            app/build/outputs/apk/en/debug/*.json
          if-no-files-found: error
          retention-days: 14
