name: Starry build (arm64)

# Manual only: a push used to start a 40-minute build that the patch check
# always failed first. Run it from the Actions tab once the anchor is green.
on:
  workflow_dispatch:

concurrency:
  group: starry-build
  cancel-in-progress: true

env:
  WMKB_ENABLE_PLAY_STORE: "false"
  WMKB_ENABLE_GMS: "false"
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g -Dorg.gradle.daemon=false

jobs:
  apk:
    name: Assemble arm64-v8a debug
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Apply the fix by anchor
        run: python3 starry/patch/apply.py

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Assemble
        run: ./gradlew assembleEnDebug -Pandroid.injected.build.abi=arm64-v8a --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: wmkb-arm64-debug
          path: |
            app/build/outputs/apk/en/debug/*.apk
            app/build/outputs/apk/en/debug/*.json
          if-no-files-found: error
          retention-days: 14
