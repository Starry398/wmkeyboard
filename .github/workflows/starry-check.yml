name: Patch check

on:
  push:
    paths:
      - 'starry/patch/**'
      - '.github/workflows/starry-check.yml'
  pull_request:
  workflow_dispatch:

jobs:
  apply:
    name: Patch applies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Show where the anchor sits
        run: |
          f=feature/ime/src/main/java/com/wasimaster/wmkeyboard/ime/WMKeyboardService.kt
          echo "lines: $(wc -l < "$f")"
          grep -n "private fun fitImeWindowHeight\|fun hideWindow\|fun showWindow\|fullHeightWindow" "$f" | head -20 || true

      - name: Verify the anchor
        run: python3 starry/patch/apply.py --check

      - name: Show the resulting diff (applied on a scratch copy)
        run: |
          f=feature/ime/src/main/java/com/wasimaster/wmkeyboard/ime/WMKeyboardService.kt
          cp "$f" /tmp/before.kt
          python3 starry/patch/apply.py
          diff -u /tmp/before.kt "$f" || true
