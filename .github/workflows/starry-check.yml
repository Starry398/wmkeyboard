name: Patch check

on:
  push:
    paths:
      - 'starry/patch/**'
      - '.github/workflows/starry-check.yml'
  pull_request:
  workflow_dispatch:

jobs:
  apply:
    name: Patch applies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Show where the anchors sit
        run: |
          f=feature/ime/src/main/java/com/wasimaster/wmkeyboard/ime/WMKeyboardService.kt
          echo "service lines: $(wc -l < "$f")"
          grep -n "private fun fitImeWindowHeight\|fun hideWindow\|fun showWindow\|fullHeightWindow" "$f" | head -20 || true
          echo "gradle lines:  $(wc -l < app/build.gradle.kts)"
          grep -n "defaultConfig\|resourceConfigurations\|localeFilters" app/build.gradle.kts | head -20 || true

      - name: Verify both anchors
        run: python3 starry/patch/apply.py --check

      - name: Apply and show the diff
        run: |
          python3 starry/patch/apply.py
          git --no-pager diff --stat
          git --no-pager diff | head -160
