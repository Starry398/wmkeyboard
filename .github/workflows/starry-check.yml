name: Patch check

on:
  push:
    paths:
      - 'starry/patch/**'
      - '.github/workflows/starry-check.yml'
  pull_request:
  workflow_dispatch:

jobs:
  apply:
    name: Patch applies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Show where the anchors sit
        run: |
          f=feature/ime/src/main/java/com/wasimaster/wmkeyboard/ime/WMKeyboardService.kt
          echo "service lines: $(wc -l < "$f")"
          grep -n "private fun fitImeWindowHeight\|fun hideWindow\|fun showWindow" "$f" | head -20 || true
          echo "res dirs: $(find app/src/main/res -maxdepth 1 -type d -name 'values-*' | wc -l)"

      - name: Verify the anchors
        run: python3 starry/patch/apply.py --check

      - name: Apply and show what changed
        run: |
          python3 starry/patch/apply.py
          git --no-pager diff --stat | tail -20
          echo '--- the service edit ---'
          git --no-pager diff -- feature/ime/src/main/java/com/wasimaster/wmkeyboard/ime/WMKeyboardService.kt | head -70
